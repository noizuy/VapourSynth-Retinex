[build-system]
requires = ["hatchling", "packaging", "meson"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-retinex"
description = "Implementation of the Retinex algorithm for VapourSynth"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "mawen1250" }]
maintainers = [{ name = "noizuy", email = "daoko@protonmail.com" }]
dependencies = ["vapoursynth>=60"]
dynamic = ["version"]

[dependency-groups]
dev = ["hatchling", "packaging", "meson", "ninja"]

[tool.hatch.version]
path = "meson.build"
pattern = "\\Wversion:\\s*'(?P<version>[^']+)'"

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/*.dylib",
    "vapoursynth/plugins/*.so",
    "vapoursynth/plugins/*.dll",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
